name: scanscore
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scanscore
      POSTGRES_USER: scanscore_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanscore_owner -d scanscore"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /run/postgresql:size=16m,noexec,nosuid,nodev
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  schema-upgrade:
    image: postgres:17-alpine
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: scanscore
      PGUSER: scanscore_owner
      PGPASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
    volumes:
      - ./scripts/schema-upgrades:/schema:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        for f in /schema/*.sql; do
          echo "Applying $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
    networks: [backend]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      schema-upgrade: {condition: service_completed_successfully}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set RUNTIME_DATABASE_URL in .env}
      SECRET_PEPPER: ${SECRET_PEPPER:?Set SECRET_PEPPER in .env}
      QR_ENCRYPTION_KEY: ${QR_ENCRYPTION_KEY:?Set QR_ENCRYPTION_KEY in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
      DB_POOL_MAX: "10"
    networks: [backend]
    ports: ["127.0.0.1:8088:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 512m

  functional-test:
    build: .
    profiles: [test]
    command: ["node", "test/functional-e2e.js"]
    depends_on:
      app: {condition: service_healthy}
    environment:
      APP_URL: http://app:8080
      PUBLIC_ORIGIN: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  privilege-test:
    build: .
    profiles: [test]
    command: ["node", "test/runtime-privileges.js"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set RUNTIME_DATABASE_URL in .env}
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes: {pgdata_v2: {}}
networks:
  backend: {internal: true}
