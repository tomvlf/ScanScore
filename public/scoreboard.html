<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoreScan Live</title><link rel="stylesheet" href="/app.css"><script defer src="/scores.js"></script><script defer src="/scoreboard.js"></script></head>
<body class="displaybody"><header><a class="brand"><b>S</b><span><strong>ScoreScan</strong><small>Live klassement</small></span></a><span id="status" class="status">Offline</span></header>
<main><section id="auth" class="card displayauth"><span class="eyebrow">Publiek scherm</span><h1>Verbind met het spel</h1><label>Ruimte-ID<input id="roomId"></label><label>Displaytoken<input id="token" type="password"></label><button id="connect" class="primary">Scorebord openen</button><p id="authMessage" role="status"></p></section>
<section id="board" class="board hidden"><div><span class="eyebrow">Live klassement</span><h1 id="title"></h1><p id="gameInfo" class="muted"></p></div><div class="board-controls"><label>Spel<select id="gameHistory"><option value="">Actief / meest recente spel volgen</option></select></label><label>Weergave<select id="scoreView"><option value="total">Totaalpunten</option><option value="questions">Punten per vraag</option></select></label></div><ol id="scoreList" class="scorelist big"></ol><div id="scoreTable" class="scoretable hidden"></div><p class="muted">Breukdelen worden pas voor weergave afgerond op twee decimalen.</p><p id="updated" class="muted" role="status"></p></section></main>
</body></html>
